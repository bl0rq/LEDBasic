; Classic ESP32 image. From this directory:
;   pio run -e esp32dev -t upload
;   pio run -e esp32dev -t uploadfs

[env:esp32dev]
platform = https://github.com/tasmota/platform-espressif32/releases/download/2026.05.50/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
board_upload.maximum_size = 3145728
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    symlink://..
    fastled/FastLED@^3.10.0
    bblanchon/ArduinoJson@^7
build_flags =
    -DCORE_DEBUG_LEVEL=1
